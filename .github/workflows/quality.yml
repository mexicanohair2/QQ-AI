name: QQ AI quality checks

on:
  pull_request:
    branches: [prototype/phase-1-chat, main]
  push:
    branches: [prototype/phase-1-chat, feature/multimodal-search-voice]

permissions:
  contents: read

concurrency:
  group: qq-ai-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate QQCross game AI contracts
        run: npm run test:game-ai
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
