name: QQ AI checks

on:
  push:
    branches:
      - feature/openai-api-key-compat
  pull_request:
    branches:
      - feature/multimodal-search-voice

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run typecheck, tests and production build
        run: npm run build
