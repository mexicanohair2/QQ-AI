name: Lock QQ AI dependencies

on:
  push:
    branches:
      - feature/qq-ai-chat-prototype
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qq-ai-lockfile
  cancel-in-progress: false

jobs:
  lockfile:
    if: github.ref == 'refs/heads/feature/qq-ai-chat-prototype'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/qq-ai-chat-prototype
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Generate reproducible npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: lock npm dependency tree"
          git push origin "HEAD:${GITHUB_REF_NAME}"
