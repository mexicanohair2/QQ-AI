name: Verify QQ AI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Record complete dependency audit
        run: |
          npm audit --json > "$RUNNER_TEMP/qq-ai-full-audit.json" || true
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/qq-ai-full-audit.json", "utf8"));
            console.log("Complete dependency audit:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(name + ": " + JSON.stringify({
                severity: item.severity,
                range: item.range,
                fixAvailable: item.fixAvailable,
                via: item.via.map((entry) => typeof entry === "string" ? entry : entry.title)
              }));
            }
          '
      - run: npm test -- --run
      - run: npm run typecheck
      - run: npm run build
      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qq-ai-dependency-audit
          path: ${{ runner.temp }}/qq-ai-full-audit.json
          if-no-files-found: warn
