name: Verify QQ AI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Inspect dependency audit and prepare lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --json > "$RUNNER_TEMP/qq-ai-npm-audit.json" || true
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/qq-ai-npm-audit.json", "utf8"));
            console.log("Dependency audit:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(name + ": " + JSON.stringify({
                severity: item.severity,
                range: item.range,
                fixAvailable: item.fixAvailable,
                via: item.via.map((entry) => typeof entry === "string" ? entry : entry.title)
              }));
            }
          '
      - run: npm test -- --run
      - run: npm run typecheck
      - run: npm run build
      - name: Upload dependency audit and generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qq-ai-dependency-report
          path: |
            package-lock.json
            ${{ runner.temp }}/qq-ai-npm-audit.json
          if-no-files-found: warn
